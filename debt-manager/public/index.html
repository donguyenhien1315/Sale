<!doctype html>
<html lang="vi"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#f6f7fb"><title>Sổ Nợ Thông Minh</title>
<style>
:root{--bg:#f5f7fb;--card:#fff;--text:#172033;--muted:#7b8498;--line:#e7eaf0;--primary:#4f6bed;--primary2:#6f87f3;--danger:#e25563;--green:#18a66a;--amber:#d18a12;--shadow:0 12px 34px rgba(27,39,75,.08);--r:20px}*{box-sizing:border-box}html{background:var(--bg)}body{margin:0;font-family:Inter,ui-sans-serif,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;color:var(--text);background:linear-gradient(180deg,#eef2ff 0,#f7f8fb 190px);min-height:100vh}.app{max-width:920px;margin:auto;padding:18px 16px 110px}.top{display:flex;align-items:center;justify-content:space-between;gap:12px}.brand h1{font-size:24px;margin:0;letter-spacing:-.6px}.brand p{margin:5px 0 0;color:var(--muted);font-size:13px}.iconbtn,.btn{border:0;background:var(--card);box-shadow:var(--shadow);border-radius:15px;min-height:44px;padding:0 15px;color:var(--text);font-weight:700;cursor:pointer;transition:.18s transform,.18s opacity}.iconbtn:active,.btn:active,.chip:active,.customer:active{transform:scale(.97)}.btn.primary{background:linear-gradient(135deg,var(--primary),var(--primary2));color:white}.btn.danger{color:var(--danger);box-shadow:none;background:#fff1f3}.stats{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;margin:20px 0}.stat{background:rgba(255,255,255,.86);backdrop-filter:blur(15px);border:1px solid rgba(255,255,255,.75);border-radius:var(--r);padding:15px;box-shadow:var(--shadow)}.stat .v{font-size:19px;font-weight:850;letter-spacing:-.4px}.stat .k{font-size:12px;color:var(--muted);margin-top:5px}.stat.debt .v{color:var(--danger)}.stat.paid .v{color:var(--green)}.smart{background:linear-gradient(135deg,#222d4f,#33457c);border-radius:22px;padding:16px;color:white;box-shadow:0 18px 45px rgba(32,48,94,.22)}.smart .label{font-size:13px;opacity:.78;margin-bottom:9px}.smartrow{display:flex;gap:8px}.smart input{flex:1;border:0;border-radius:14px;padding:13px 14px;font-size:16px;outline:0;background:rgba(255,255,255,.95)}.smart button{border:0;border-radius:14px;padding:0 15px;background:#fff;color:#26345f;font-weight:800}.hint{font-size:12px;opacity:.65;margin-top:9px}.toolbar{display:flex;gap:9px;margin:18px 0 10px}.search{position:relative;flex:1}.search input{width:100%;border:1px solid var(--line);background:var(--card);border-radius:15px;padding:13px 14px 13px 41px;font-size:15px;outline:0}.search span{position:absolute;left:14px;top:12px}.sectionhead{display:flex;justify-content:space-between;align-items:center;margin:14px 2px 8px}.sectionhead h2{font-size:15px;margin:0}.count{font-size:12px;color:var(--muted)}.list{display:flex;flex-direction:column;gap:9px}.customer{background:var(--card);border:1px solid var(--line);border-radius:18px;padding:14px;display:grid;grid-template-columns:46px 1fr auto;gap:12px;align-items:center;cursor:pointer;box-shadow:0 6px 20px rgba(20,30,60,.035);transition:.15s}.avatar{width:46px;height:46px;border-radius:15px;background:linear-gradient(135deg,#e9edff,#d9e1ff);display:grid;place-items:center;font-weight:850;color:#4058cb}.name{font-weight:800}.meta{font-size:12px;color:var(--muted);margin-top:4px}.money{text-align:right;font-weight:850}.money.owing{color:var(--danger)}.money.clear{color:var(--green)}.bottom{position:fixed;left:0;right:0;bottom:0;background:rgba(255,255,255,.9);backdrop-filter:blur(18px);border-top:1px solid var(--line);padding:10px 16px calc(10px + env(safe-area-inset-bottom));z-index:20}.bottomin{max-width:920px;margin:auto;display:grid;grid-template-columns:1fr 1fr;gap:10px}.fab{background:linear-gradient(135deg,var(--primary),var(--primary2));color:white}.overlay{position:fixed;inset:0;background:rgba(14,20,36,.35);backdrop-filter:blur(4px);z-index:50;display:none;align-items:flex-end;justify-content:center}.overlay.show{display:flex}.sheet{width:min(920px,100%);max-height:91vh;overflow:auto;background:var(--bg);border-radius:28px 28px 0 0;padding:18px 16px calc(25px + env(safe-area-inset-bottom));animation:up .2s ease-out}@keyframes up{from{transform:translateY(24px);opacity:.4}to{transform:none;opacity:1}}.sheethead{display:flex;justify-content:space-between;align-items:center;position:sticky;top:-18px;background:var(--bg);padding:10px 0 12px;z-index:2}.sheethead h3{margin:0;font-size:19px}.close{border:0;background:#e9ecf3;width:38px;height:38px;border-radius:13px;font-size:18px}.balanceCard{background:linear-gradient(135deg,#fff,#f3f5ff);border:1px solid var(--line);border-radius:21px;padding:16px;display:flex;justify-content:space-between;align-items:end}.balanceCard .big{font-size:25px;font-weight:900;color:var(--danger)}.actions{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin:12px 0}.actions .btn{box-shadow:none;border:1px solid var(--line)}.timeline{display:flex;flex-direction:column;gap:8px}.event{background:#fff;border:1px solid var(--line);border-radius:16px;padding:13px;display:flex;justify-content:space-between;gap:10px}.event .type{font-size:12px;color:var(--muted);margin-bottom:5px}.event .amt{font-weight:850}.event.debt .amt{color:var(--danger)}.event.pay .amt{color:var(--green)}.event .date{font-size:12px;color:var(--muted);white-space:nowrap}.form{display:grid;gap:10px}.field label{font-size:12px;color:var(--muted);display:block;margin:0 0 6px 3px}.field input,.field textarea,.field select{width:100%;border:1px solid var(--line);background:white;border-radius:14px;padding:13px 14px;font-size:16px;outline:0}.field textarea{min-height:78px;resize:vertical}.row2{display:grid;grid-template-columns:1fr 1fr;gap:10px}.empty{text-align:center;color:var(--muted);padding:42px 16px;background:#fff;border:1px dashed var(--line);border-radius:18px}.toast{position:fixed;left:50%;bottom:98px;transform:translateX(-50%) translateY(15px);background:#20283b;color:#fff;border-radius:13px;padding:11px 15px;font-size:13px;opacity:0;pointer-events:none;transition:.2s;z-index:90}.toast.show{opacity:1;transform:translateX(-50%)}@media(max-width:560px){.stats{grid-template-columns:1fr 1fr}.stat:last-child{grid-column:1/-1}.stat .v{font-size:18px}.app{padding-left:12px;padding-right:12px}.smartrow input{min-width:0}.row2{grid-template-columns:1fr}}
</style></head><body><main class="app">
<div class="top"><div class="brand"><h1>💳 Sổ Nợ</h1><p>Quản lý công nợ rõ ràng, nhanh và an toàn</p></div><button class="iconbtn" onclick="load()">↻</button></div>
<section class="stats"><div class="stat debt"><div class="v" id="totalBalance">0 ₫</div><div class="k">Còn phải thu</div></div><div class="stat paid"><div class="v" id="totalPaid">0 ₫</div><div class="k">Đã thu</div></div><div class="stat"><div class="v" id="owingCount">0</div><div class="k">Khách đang nợ</div></div></section>
<section class="smart"><div class="label">✦ Nhập nhanh bằng câu lệnh</div><div class="smartrow"><input id="cmd" placeholder="Ví dụ: Chất nợ 30k 2c"><button onclick="smartCommand()">Ghi</button></div><div class="hint">Hiểu “nợ”, “trả”, 10k/30k/100.000 và phần ghi chú phía sau.</div></section>
<div class="toolbar"><div class="search"><span>⌕</span><input id="search" placeholder="Tìm tên hoặc số điện thoại" oninput="renderCustomers()"></div><button class="iconbtn" onclick="openCustomerForm()">＋</button></div>
<div class="sectionhead"><h2>Khách hàng</h2><div class="count" id="count"></div></div><div id="list" class="list"></div>
</main><div class="bottom"><div class="bottomin"><button class="btn" onclick="openCustomerForm()">＋ Thêm khách</button><button class="btn fab" onclick="document.getElementById('cmd').focus()">✦ Nhập nhanh</button></div></div>
<div id="overlay" class="overlay" onclick="if(event.target===this)closeSheet()"><div id="sheet" class="sheet"></div></div><div id="toast" class="toast"></div>
<script>
let state={customers:[],totals:{},selected:null}; const $=s=>document.querySelector(s); const fmt=n=>new Intl.NumberFormat('vi-VN').format(Number(n||0))+' ₫'; const esc=s=>String(s||'').replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m])); const today=()=>new Date().toISOString().slice(0,10);
async function api(path,opt={}){const r=await fetch(path,{headers:{'content-type':'application/json'},...opt});const d=await r.json();if(!r.ok)throw Error(d.error||'Có lỗi xảy ra');return d}function toast(t){const e=$('#toast');e.textContent=t;e.classList.add('show');setTimeout(()=>e.classList.remove('show'),1700)}
async function load(){try{const d=await api('/api/dashboard');state.customers=d.customers;state.totals=d.totals;$('#totalBalance').textContent=fmt(d.totals.balance);$('#totalPaid').textContent=fmt(d.totals.paid);$('#owingCount').textContent=d.owingCount;renderCustomers()}catch(e){toast(e.message)}}
function renderCustomers(){const q=$('#search').value.trim().toLowerCase();const arr=state.customers.filter(c=>(c.name+' '+(c.phone||'')).toLowerCase().includes(q));$('#count').textContent=arr.length+' khách';$('#list').innerHTML=arr.length?arr.map(c=>`<div class="customer" onclick="openCustomer(${c.id})"><div class="avatar">${esc(c.name.slice(0,2).toUpperCase())}</div><div><div class="name">${esc(c.name)}</div><div class="meta">${esc(c.phone||'Không có SĐT')} · Đã trả ${fmt(c.total_paid)}</div></div><div class="money ${c.balance>0?'owing':'clear'}">${c.balance>0?fmt(c.balance):'Đã xong'}</div></div>`).join(''):`<div class="empty">Chưa có khách hàng phù hợp.</div>`}
function show(html){$('#sheet').innerHTML=html;$('#overlay').classList.add('show')}function closeSheet(){$('#overlay').classList.remove('show')}function head(t){return `<div class="sheethead"><h3>${t}</h3><button class="close" onclick="closeSheet()">×</button></div>`}
function openCustomerForm(c=null){show(head(c?'Sửa khách hàng':'Thêm khách hàng')+`<form class="form" onsubmit="saveCustomer(event,${c?.id||0})"><div class="field"><label>Tên khách hàng</label><input id="fName" value="${esc(c?.name||'')}" required autofocus></div><div class="field"><label>Số điện thoại</label><input id="fPhone" value="${esc(c?.phone||'')}" inputmode="tel"></div><div class="field"><label>Ghi chú</label><textarea id="fNote">${esc(c?.note||'')}</textarea></div><button class="btn primary" type="submit">${c?'Lưu thay đổi':'Tạo khách hàng'}</button></form>`)}
async function saveCustomer(e,id){e.preventDefault();try{await api(id?'/api/customers/'+id:'/api/customers',{method:id?'PUT':'POST',body:JSON.stringify({name:$('#fName').value,phone:$('#fPhone').value,note:$('#fNote').value})});closeSheet();await load();toast(id?'Đã cập nhật':'Đã thêm khách')}catch(x){toast(x.message)}}
async function openCustomer(id){try{const c=await api('/api/customers/'+id);state.selected=c;renderDetail(c)}catch(e){toast(e.message)}}
function renderDetail(c){const events=[...c.debts.map(x=>({...x,_kind:'debt',_date:x.debt_date})),...c.payments.map(x=>({...x,_kind:'pay',_date:x.payment_date}))].sort((a,b)=>(b._date||'').localeCompare(a._date||'')||b.id-a.id);show(head(esc(c.name))+`<div class="balanceCard"><div><div class="meta">Còn nợ</div><div class="big">${fmt(c.balance)}</div></div><div class="meta">Nợ ${fmt(c.totalDebt)}<br>Đã trả ${fmt(c.totalPaid)}</div></div><div class="actions"><button class="btn" onclick="openDebtForm(${c.id})">＋ Ghi nợ</button><button class="btn" onclick="openPayForm(${c.id},${Math.max(0,c.balance)})">✓ Trả nợ</button></div><div class="sectionhead"><h2>Lịch sử</h2><button class="btn" style="min-height:34px;padding:0 10px;box-shadow:none" onclick='openCustomerForm(${JSON.stringify({id:c.id,name:c.name,phone:c.phone,note:c.note}).replace(/'/g,"&#39;")})'>Sửa khách</button></div><div class="timeline">${events.length?events.map(x=>`<div class="event ${x._kind}"><div><div class="type">${x._kind==='debt'?'Ghi nợ':'Thanh toán'}</div><div class="amt">${x._kind==='debt'?'+':'−'} ${fmt(x.amount)}</div><div class="meta">${esc(x.item_note||x.note||'Không ghi chú')}</div></div><div><div class="date">${esc(x._date)}</div><button class="btn danger" style="min-height:30px;padding:0 9px;margin-top:7px" onclick="removeEvent('${x._kind}',${x.id},${c.id})">Xóa</button></div></div>`).join(''):'<div class="empty">Chưa có giao dịch.</div>'}</div><button class="btn danger" style="width:100%;margin-top:18px" onclick="deleteCustomer(${c.id})">Xóa khách hàng</button>`)}
function openDebtForm(id,pref={}){show(head('Ghi nợ')+`<form class="form" onsubmit="saveDebt(event,${id})"><div class="field"><label>Số tiền</label><input id="dAmount" inputmode="numeric" value="${pref.amount||''}" placeholder="30.000" required autofocus></div><div class="field"><label>Món nợ / ghi chú</label><input id="dNote" value="${esc(pref.note||'')}" placeholder="2c, cà phê, bánh..."></div><div class="field"><label>Ngày ghi nợ</label><input id="dDate" type="date" value="${today()}"></div><button class="btn primary">Lưu khoản nợ</button></form>`)}
function openPayForm(id,balance,pref={}){show(head('Trả nợ')+`<form class="form" onsubmit="savePay(event,${id})"><div class="field"><label>Số tiền khách trả</label><input id="pAmount" inputmode="numeric" value="${pref.amount||balance||''}" required autofocus></div><div class="field"><label>Ghi chú</label><input id="pNote" value="${esc(pref.note||'')}" placeholder="Tiền mặt, chuyển khoản..."></div><div class="field"><label>Ngày trả</label><input id="pDate" type="date" value="${today()}"></div><button class="btn primary">Xác nhận thanh toán</button></form>`)}
function money(v){return Math.round(Number(String(v).toLowerCase().replace(/\./g,'').replace(/,/g,'').replace(/k$/,'000'))||0)}async function saveDebt(e,id){e.preventDefault();try{const c=await api('/api/debts',{method:'POST',body:JSON.stringify({customer_id:id,amount:money($('#dAmount').value),item_note:$('#dNote').value,debt_date:$('#dDate').value})});await load();renderDetail(c);toast('Đã ghi nợ')}catch(x){toast(x.message)}}async function savePay(e,id){e.preventDefault();try{const c=await api('/api/payments',{method:'POST',body:JSON.stringify({customer_id:id,amount:money($('#pAmount').value),note:$('#pNote').value,payment_date:$('#pDate').value})});await load();renderDetail(c);toast('Đã ghi nhận thanh toán')}catch(x){toast(x.message)}}
async function removeEvent(kind,id,cid){if(!confirm('Xóa giao dịch này?'))return;try{const c=await api(kind==='debt'?'/api/debts/'+id:'/api/payments/'+id,{method:'DELETE'});await load();renderDetail(c);toast('Đã xóa')}catch(e){toast(e.message)}}async function deleteCustomer(id){if(!confirm('Xóa khách hàng và toàn bộ lịch sử?'))return;try{await api('/api/customers/'+id,{method:'DELETE'});closeSheet();await load();toast('Đã xóa khách hàng')}catch(e){toast(e.message)}}
function parseCmd(s){const m=s.trim().match(/^(.+?)\s+(nợ|no|trả|tra)\s+([\d.,]+\s*k?)(?:\s+(.*))?$/i);if(!m)return null;return{name:m[1].trim(),type:/nợ|no/i.test(m[2])?'debt':'pay',amount:money(m[3].replace(/\s/g,'')),note:(m[4]||'').trim()}}async function smartCommand(){const p=parseCmd($('#cmd').value);if(!p||!p.amount)return toast('Ví dụ: Chất nợ 30k 2c');let c=state.customers.find(x=>x.name.toLowerCase()===p.name.toLowerCase())||state.customers.find(x=>x.name.toLowerCase().includes(p.name.toLowerCase()));if(!c){if(!confirm(`Chưa có khách “${p.name}”. Tạo mới?`))return;try{c=await api('/api/customers',{method:'POST',body:JSON.stringify({name:p.name})});await load()}catch(e){return toast(e.message)}}$('#cmd').value='';p.type==='debt'?openDebtForm(c.id,p):openPayForm(c.id,c.balance,p)}
load();
</script></body></html>
